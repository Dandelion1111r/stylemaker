/* Ton sur Ton · editorial luxury: ivory paper, ink, one champagne accent.
   Big photography, very little text, hairlines instead of boxes. */
:root{
  --bg:#F4F0EA;--paper:#FBF9F5;--ink:#141210;--soft:#6F675F;--line:#DCD4C8;--accent:#A9834F;--dark:#141210;--on-dark:#EFE9E0;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(20px,5vw,72px);--gap:clamp(4rem,10vw,9rem);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.04;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(3.2rem,8.4vw,8.2rem)}
h2{font-size:clamp(2.4rem,5.2vw,4.6rem)}
h3{font-size:clamp(1.4rem,2vw,1.9rem);line-height:1.15}
em{font-style:italic}
h1 span{display:block}
.dark .dot{border-color:rgba(255,255,255,.28)}
p{margin:0}
.label{font-size:.7rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:1.1rem;letter-spacing:.02em}
.lead{font-size:clamp(1.05rem,1.4vw,1.2rem);color:var(--soft);max-width:34ch;line-height:1.6}
.fine{font-size:.82rem;color:var(--soft)}
.skip{position:absolute;left:-999px;top:0;z-index:50;background:var(--ink);color:var(--bg);padding:.6rem 1rem}
.skip:focus{left:0}
.proto{background:var(--ink);color:var(--on-dark);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:.55rem var(--pad)}

/* links that act as buttons */
.cta{display:inline-flex;align-items:center;gap:.9rem;font-size:.74rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;padding:1rem 0;border:0;background:none;border-bottom:1px solid currentColor}
.cta::after{content:"→";letter-spacing:0;font-size:1rem;transition:transform .35s}
.cta:hover::after{transform:translateX(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.8rem;font-size:.72rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;padding:1.1rem 2.1rem;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:background .3s,color .3s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.25;pointer-events:none}

/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.6rem var(--pad);border-bottom:1px solid var(--line)}
.top nav{display:flex;gap:2rem}
.top nav a,.lang button{font-size:.68rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;color:var(--soft);transition:color .25s}
.top nav a:hover{color:var(--ink)}
.logo{font-family:var(--display);font-size:1.45rem;letter-spacing:.42em;text-decoration:none;white-space:nowrap;padding-left:.42em}
.logo em{font-style:italic;text-transform:none;letter-spacing:.04em;margin:0 .18em 0 -.1em}
.lang{display:flex;gap:1.1rem;justify-content:flex-end}
.lang button{background:none;border:0;padding:.3rem 0;border-bottom:1px solid transparent}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 110px);border-bottom:1px solid var(--line)}
.hero-copy{display:flex;flex-direction:column;justify-content:space-between;gap:3rem;padding:clamp(3rem,7vw,6rem) var(--pad)}
.hero-copy h1 em{color:var(--accent)}
.hero-copy .stack{display:flex;flex-direction:column;gap:2rem}
.hero-img{position:relative;overflow:hidden;background:#d9d6d1}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.hero-meta{display:flex;justify-content:space-between;gap:2rem;align-items:flex-end;flex-wrap:wrap}

/* generic section */
.sec{padding:var(--gap) var(--pad);border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem 4rem;align-items:end;margin-bottom:clamp(3rem,6vw,5rem)}
.sec-head .left{display:flex;flex-direction:column;gap:1.4rem}
.sec-head .lead{justify-self:end}
.dark{background:var(--dark);color:var(--on-dark);border-color:#2a2622}
.dark .label,.dark .lead,.dark .fine{color:#A9A196}

/* manifesto */
.manifesto{padding:var(--gap) var(--pad);text-align:center;border-bottom:1px solid var(--line)}
.manifesto p{font-family:var(--display);font-size:clamp(1.8rem,3.6vw,3.3rem);line-height:1.2;max-width:22ch;margin:0 auto}
.manifesto p em{color:var(--accent)}

/* triptych */
.trip{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,28px)}
.trip figure{margin:0;display:flex;flex-direction:column;gap:1rem}
.trip .ph{overflow:hidden;aspect-ratio:4/5;background:#ddd}
.trip img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.trip figure:hover img{transform:scale(1.04)}
.trip figure:nth-child(2){margin-top:clamp(2rem,6vw,6rem)}
.trip figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}

/* split feature */
.feature{display:grid;grid-template-columns:5fr 7fr;gap:clamp(2rem,6vw,7rem);align-items:start}
.feature>*{min-width:0}
.feature .ph{overflow:hidden;aspect-ratio:4/5;background:#ddd;position:sticky;top:2rem}
.feature .ph img{width:100%;height:100%;object-fit:cover}
.panel{display:flex;flex-direction:column;gap:2.4rem}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem 2rem;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:.9rem 0;margin-bottom:-1px;border-bottom:1px solid transparent;font-size:.72rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);transition:color .25s,border-color .25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.dark .tabs{border-color:#2f2a25}
.dark .tabs button[aria-pressed="true"]{color:var(--on-dark);border-color:var(--on-dark)}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.title-row h3{font-size:clamp(2rem,3.4vw,3rem)}

/* palette strip */
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:0;height:clamp(110px,14vw,170px)}
.strip button{border:0;padding:0;background:var(--c);position:relative;transition:flex .3s}
.strip button::after{content:attr(data-n);position:absolute;left:.6rem;bottom:.55rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92);opacity:0;transition:opacity .25s;text-shadow:0 1px 2px rgba(0,0,0,.25);text-align:left;line-height:1.3;max-width:90%}
.strip button:hover::after,.strip button[aria-pressed="true"]::after{opacity:1}
.strip button.light::after{color:rgba(20,18,16,.8);text-shadow:none}
.strip button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--ink)}
.minis{display:flex;gap:2.5rem;flex-wrap:wrap}
.minis>div{display:flex;flex-direction:column;gap:.7rem}
.dots{display:flex;gap:.4rem}
.dot{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.1);position:relative;flex:none}
.dot.sm{width:.8rem;height:.8rem}
.dot.x::after{content:"";position:absolute;left:50%;top:-12%;width:1px;height:124%;background:var(--ink);transform:rotate(45deg)}
.kv{display:grid;grid-template-columns:9rem 1fr;border-top:1px solid var(--line)}
.kv dt,.kv dd{margin:0;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.kv dt{font-size:.66rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);padding-top:1.35rem}
.kv ul{margin:0;padding:0;list-style:none;display:grid;gap:.35rem}

/* silhouette */
.sil{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr);gap:clamp(2rem,4vw,4rem);align-items:start}
.sil svg{width:100%;height:auto}
.body-line{fill:none;stroke:var(--ink);stroke-width:1}
.guide{stroke:var(--accent);stroke-width:1;stroke-dasharray:2 6}
.cap{font-family:var(--mono);font-size:11px;fill:var(--soft);letter-spacing:.08em}

/* quiz (dark chapter) */
.quiz{max-width:46rem;margin:0 auto;min-height:24rem}
.progress{height:1px;background:#2f2a25;margin-bottom:2.5rem}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.qmeta{display:flex;justify-content:space-between;margin-bottom:1.2rem}
.quiz h3{font-size:clamp(1.8rem,3.2vw,2.6rem);margin-bottom:2.4rem}
.opts{display:grid;gap:0;border-top:1px solid #2f2a25}
.opts.two{grid-template-columns:1fr 1fr;column-gap:2rem}
.opt{text-align:left;background:none;border:0;border-bottom:1px solid #2f2a25;padding:1.15rem 0;display:flex;justify-content:space-between;gap:1rem;color:var(--on-dark);transition:color .2s,padding .3s}
.opt::after{content:"";width:.55rem;height:.55rem;border:1px solid #6d655c;border-radius:50%;flex:none;margin-top:.45rem}
.opt:hover{padding-left:.5rem}
.opt[aria-pressed="true"]{color:var(--accent)}
.opt[aria-pressed="true"]::after{background:var(--accent);border-color:var(--accent)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:3rem;flex-wrap:wrap}
.dark .btn{background:var(--on-dark);color:var(--ink);border-color:var(--on-dark)}
.dark .btn:hover{background:transparent;color:var(--on-dark)}
.dark .btn.line{background:transparent;color:var(--on-dark);border-color:#5b544c}
.dark .btn.line:hover{border-color:var(--on-dark)}
.dark .cta{color:var(--on-dark)}
.start{display:flex;flex-direction:column;gap:2.2rem;text-align:center;align-items:center}
.start h3{margin:0}
.fields{display:flex;gap:2.5rem;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:.5rem}
.field input{background:transparent;border:0;border-bottom:1px solid #5b544c;padding:.6rem 0;width:12rem;font-family:var(--display);font-size:1.8rem;color:var(--on-dark)}
.field input:focus{outline:none;border-color:var(--accent)}
.result{display:flex;flex-direction:column;gap:2.6rem}
.result .hd{display:flex;flex-direction:column;gap:.8rem}
.result h3{margin:0;font-size:clamp(2.2rem,4vw,3.4rem)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem 3rem;border-top:1px solid #2f2a25;padding-top:2.4rem}
.rgrid>div{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.rlist{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.rlist li{display:flex;gap:.7rem;align-items:center}
.result .strip{height:70px}
.copied{font-size:.8rem;color:var(--accent)}

/* drape */
.drapes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,20px)}
.drape{position:relative;aspect-ratio:4/5;background:var(--c);transition:background .5s;overflow:hidden}
.drape .face{position:absolute;left:50%;top:12%;width:64%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;overflow:hidden;background:#cfc8c0}
.drape .face img{width:100%;height:100%;object-fit:cover}
.drape .tag{position:absolute;left:0;right:0;bottom:0;padding:.9rem 1rem;display:flex;justify-content:space-between;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.95);background:linear-gradient(transparent,rgba(0,0,0,.28))}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.range{display:grid;grid-template-columns:auto 1fr;gap:.8rem 1.4rem;align-items:center}
.range input{accent-color:var(--ink)}

/* outfits */
.look{display:grid;grid-template-columns:5fr 7fr;gap:clamp(2rem,6vw,7rem);align-items:start}
.look>*{min-width:0}
.look .ph{aspect-ratio:4/5;overflow:hidden;background:#ddd;position:relative}
.look .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.look .ph .bar{position:absolute;left:0;right:0;bottom:0;display:flex;height:12px}
.look .ph .bar i{flex:1;background:var(--c)}
.olist{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.olist li{display:grid;grid-template-columns:8rem 1fr auto;gap:1rem;align-items:baseline;padding:1.05rem 0;border-bottom:1px solid var(--line)}
.olist .slot{font-size:.64rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.olist .it{font-family:var(--display);font-size:1.25rem;line-height:1.25}
.olist .col{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--soft);white-space:nowrap}
.why{display:grid;gap:.6rem;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:1.6rem 1fr;color:var(--soft);font-size:.95rem}
.why li::before{content:"—";color:var(--accent)}
.row{display:flex;gap:2.5rem;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}

/* trends */
.tfeat{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,28px);margin-bottom:clamp(3rem,6vw,5rem)}
.tcard{display:flex;flex-direction:column;gap:1rem;min-width:0}
.tcard .ph{aspect-ratio:3/4;overflow:hidden;background:#ddd}
.tcard img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tcard:hover img{transform:scale(1.04)}
.tcard h3{font-size:1.35rem}
.tag{font-size:.6rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.tag.yes{color:var(--accent)}
.tag.adapt{color:var(--soft)}
.tip{font-size:.92rem;color:var(--soft)}
.tlist{border-top:1px solid var(--line)}
.tlist article{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr) 9rem;gap:2rem;padding:1.5rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.tlist h3{font-size:1.35rem}

/* membership, privacy, faq */
.tiers{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tier{padding:3rem 0;display:flex;flex-direction:column;gap:1.6rem}
.tier+.tier{border-left:1px solid var(--line);padding-left:clamp(2rem,4vw,4rem)}
.price{font-family:var(--display);font-size:clamp(3rem,6vw,5rem);line-height:1}
.tier ul{margin:0;padding:0;list-style:none;display:grid;gap:.7rem}
.tier li{display:grid;grid-template-columns:1.6rem 1fr}
.tier li::before{content:"—";color:var(--accent)}
.tier.alt{color:var(--soft)}
.trusts{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5rem;border-top:1px solid #2f2a25;padding-top:2.5rem}
.trust{display:flex;flex-direction:column;gap:.8rem}
.trust h3{font-size:1.3rem}
.faq{border-top:1px solid var(--line);max-width:56rem}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:2rem;padding:1.4rem 0;font-family:var(--display);font-size:clamp(1.2rem,1.8vw,1.5rem)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--body);font-weight:300;font-size:1.5rem;line-height:1;color:var(--accent);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 1.5rem;color:var(--soft);max-width:60ch}

footer{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end;padding:4rem var(--pad) 3rem;background:var(--dark);color:var(--on-dark)}
footer .logo{font-size:clamp(2.2rem,6vw,5rem);letter-spacing:.3em}
footer .meta{display:flex;flex-direction:column;gap:.6rem;align-items:flex-end;text-align:right}
footer .meta p,footer .meta a{font-size:.72rem;letter-spacing:.14em;color:#A9A196;text-decoration:none}
footer .meta a:hover{color:var(--on-dark)}
footer .links{display:flex;gap:1.6rem;flex-wrap:wrap;justify-content:flex-end}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

@media (max-width:980px){
  .top{grid-template-columns:auto 1fr;gap:1rem}
  .top nav{display:none}
  .logo{justify-self:start;padding-left:0;font-size:1.15rem}
  .hero{grid-template-columns:1fr;min-height:0}
  .hero-img{aspect-ratio:4/5;order:-1}
  .sec-head,.feature,.look,.sil{grid-template-columns:1fr}
  .sec-head .lead{justify-self:start}
  .feature .ph{position:relative;top:0;max-width:30rem}
  .trip{grid-template-columns:1fr 1fr}
  .trip figure:nth-child(2){margin-top:0}
  .trip figure:nth-child(3){display:none}
  .tfeat{grid-template-columns:1fr 1fr}
  .trusts{grid-template-columns:1fr 1fr}
  .tlist article{grid-template-columns:1fr;gap:.5rem}
}
@media (max-width:600px){
  .strip{grid-template-columns:repeat(4,1fr);height:auto}
  .strip button{aspect-ratio:1}
  .opts.two,.rgrid,.tiers,.trusts,.drapes{grid-template-columns:1fr 1fr}
  .opts.two{grid-template-columns:1fr}
  .rgrid{grid-template-columns:1fr}
  .tiers{grid-template-columns:1fr}
  .tier+.tier{border-left:0;border-top:1px solid var(--line);padding-left:0}
  .trusts{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{padding-bottom:0;border-bottom:0}
  .olist li{grid-template-columns:1fr auto}
  .olist .slot{grid-column:1/-1}
  footer{grid-template-columns:1fr}
  footer .meta{align-items:flex-start;text-align:left}
  footer .links{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>

/* ---------- helpers & state ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const LANGS = ["de","ro","en"];
const saved = store.get("styleai-lang");
let lang = LANGS.includes(saved) ? saved : "de";
const L = () => T[lang];
const X = o => o == null ? "" : (o[lang] ?? o.de);
const LI = {de:1,ro:2,en:3};
const cn = sw => sw[LI[lang]];               /* colour name */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const DEMO = {g:"w",season:"summer",shape:"X",hc:"mid",styles:["klassisch","minimal"],demo:true};
let profile = store.get("styleai-profile");
const P = () => profile || DEMO;
const gName = g => g==="m" ? L().gm1 : L().gw1;

function pills(el, items, cur, onPick){
  el.innerHTML = "";
  items.forEach(([k,label]) => {
    const b = document.createElement("button"); b.className = "pill"; b.type = "button";
    b.textContent = label; b.setAttribute("aria-pressed", k===cur);
    b.onclick = () => onPick(k); el.appendChild(b);
  });
}
function swatch(sw, opts={}){
  const tag = opts.btn ? "button" : "span";
  return `<${tag} class="dot${opts.sm?" sm":""}${opts.x?" x":""}" style="--c:${sw[0]}" title="${esc(cn(sw))}" aria-label="${esc(cn(sw))}"${opts.btn?` type="button" data-i="${opts.i}" aria-pressed="${!!opts.on}"`:""}></${tag}>`;
}
const isLight = hex => { const n = parseInt(hex.slice(1),16); return ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114)/1000 > 175; };
function strip(list, cur){
  return list.map((c,i) => `<button type="button" class="${isLight(c[0])?"light":""}" style="--c:${c[0]}" data-i="${i}" data-n="${esc(cn(c))}" aria-label="${esc(cn(c))}" aria-pressed="${i===cur}"></button>`).join("");
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { const v = L()[n.dataset.t]; if(typeof v === "string") n.textContent = v; });
  document.querySelectorAll("[data-th]").forEach(n => n.innerHTML = L()[n.dataset.th]);
  document.querySelectorAll("[data-tl]").forEach(n => n.innerHTML = L()[n.dataset.tl].map(x=>`<li>${esc(x)}</li>`).join(""));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#faqList").innerHTML = L().FAQ.map(([q,a]) => `<details><summary>${esc(q)}</summary><p class="muted">${esc(a)}</p></details>`).join("");
  renderAll();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("styleai-lang", lang); applyLang(); });
function renderAll(){ renderSeasons(); renderFigure(); renderQuiz(); renderDrape(); renderOutfit(); renderTrends(); }

/* ---------- colour types ---------- */
let ctSeason = P().season, ctPick = 0;
function renderSeasons(){
  const s = SEASONS[ctSeason];
  pills($("#seasons"), SKEYS.map(k => [k, X(SEASONS[k].name)]), ctSeason, k => { ctSeason = k; ctPick = 0; renderSeasons(); });
  $("#ctName").textContent = X(s.name); $("#ctSub").textContent = X(s.sub);
  $("#ctRule").textContent = X(s.rule); $("#ctMetal").textContent = X(s.metal);
  $("#ctBest").innerHTML = strip(s.best, ctPick);
  $("#ctNeutral").innerHTML = s.neutral.map(c => swatch(c)).join("");
  $("#ctAvoid").innerHTML = s.avoid.map(c => swatch(c,{x:true})).join("");
  $("#ctBest").querySelectorAll("button").forEach(b => b.onclick = () => { ctPick = +b.dataset.i; renderSeasons(); });
}

/* ---------- body shapes ---------- */
let fgG = P().g, fgShape = P().shape;
function smooth(pts){
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){ const m = [(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2]; d += ` Q${pts[i][0]} ${pts[i][1]} ${m[0]} ${m[1]}`; }
  const l = pts[pts.length-1]; return d + ` L${l[0]} ${l[1]}`;
}
function bodySvg(p, g){
  const c = 150, S=62*p.sh, B=54*p.bu, W=48*p.wa, H=58*p.hi, neck = g==="m"?17:14;
  const y = {neck:96,sh:124,bu:172,wa:238,hi:296,kn:430,an:500};
  const right = [[c+neck,y.neck],[c+neck+4,y.sh-12],[c+S,y.sh],[c+S-4,y.sh+18],[c+B,y.bu],[c+W,y.wa],[c+H,y.hi],[c+H*.8,y.hi+50],[c+H*.5,y.kn],[c+20,y.an]];
  const left = right.map(([x,yy]) => [2*c-x,yy]).reverse();
  const path = smooth(right) + " L" + left.map(p=>p.join(" ")).join(" L") + " Z";
  const line = (yy,w,lbl) => `<line class="guide" x1="${c-w-14}" y1="${yy}" x2="${c+w+14}" y2="${yy}"/><text x="${c+w+22}" y="${yy+4}" class="cap">${esc(lbl.toUpperCase())}</text>`;
  return `<svg viewBox="0 0 330 520" role="img" aria-label="${esc(X(SHAPES[g][fgShape].name))}">
    <circle class="body-line" cx="${c}" cy="58" r="${g==="m"?30:28}"/>
    <path class="body-line" d="${path}" stroke-linejoin="round"/>
    <line class="body-line" x1="${c}" y1="${y.hi+38}" x2="${c}" y2="${y.an}"/>
    ${line(y.sh,S,L().lblShoulder)}${line(y.wa,W,L().lblWaist)}${line(y.hi,H,L().lblHip)}
  </svg>`;
}
function renderFigure(){
  pills($("#fgGender"), [["w",L().gw],["m",L().gm]], fgG, k => { fgG = k; renderFigure(); });
  pills($("#fgShapes"), SHKEYS.map(k => [k, X(SHAPES[fgG][k].name)]), fgShape, k => { fgShape = k; renderFigure(); });
  const s = SHAPES[fgG][fgShape];
  $("#fgName").textContent = X(s.name);
  $("#fgGoal").textContent = X(s.goal); $("#fgAcc").textContent = X(s.acc);
  $("#fgGood").innerHTML = `<ul>${X(s.good).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#fgBad").innerHTML = `<ul>${X(s.bad).slice(0,2).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#fgVisual").innerHTML = bodySvg(s.p, fgG);
}

const QL = [

    <div class="qmeta"><span class="label">${esc(t.qOf(st.i+1, QL.length))}</span>${q.multi?`<span class="label">${esc(t.qMulti)}</span>`:""}</div><h3>${esc(title)}</h3>`;
  const isLast = st.i === QL.length-1;
  if(q.form){
    const v = st.a.size || {};
    qEl.innerHTML = head + `<div class="fields">
        <label class="field"><span class="label">${esc(t.fHeight)}</span><input type="number" id="f-h" inputmode="numeric" min="120" max="230" value="${esc(v.h||"")}" placeholder="170"></label>

  qEl.innerHTML = head + `<div class="opts${q.multi||opts.length>4?" two":""}${q.multi?" multi":""}">${opts.map((o,j)=>`<button class="opt" data-j="${j}" aria-pressed="${sel.includes(j)}">${esc(o)}</button>`).join("")}</div>
    <div class="qnav"><button class="cta" id="q-back">${esc(t.qBack)}</button>
    <button class="btn" id="q-next" ${sel.length?"":"disabled"}>${esc(isLast?t.qDone:t.qNext)}</button></div>`;
  qEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const j = +b.dataset.j;
    if(q.multi){ let cur = (st.a[q.k]||[]).slice(); cur = cur.includes(j) ? cur.filter(x=>x!==j) : cur.concat(j); st.a[q.k] = cur; saveQ(); renderQuiz(); }
    else { st.a[q.k] = [j]; st.i++; saveQ(); renderQuiz(); }
  });
  $("#q-back").onclick = () => { st.i--; saveQ(); renderQuiz(); };
  $("#q-next").onclick = () => { st.i++; saveQ(); renderQuiz(); };
}
function score(){
  const a = st.a, s = {w:0,d:0,c:0};
  QL.forEach(q => { if(q.o) (a[q.k]||[]).forEach(j => { const v = q.o[j]; for(const k in v) s[k]+=v[k]; }); });
  const g = (a.g||[0])[0] === 1 ? "m" : "w";
  let season;
  if(s.w > 0){ const sp = (s.d<0?1:0)+(s.c>0?1:0), au = (s.d>0?1:0)+(s.c<0?1:0); season = sp>au ? "spring" : au>sp ? "autumn" : (s.d>0 ? "autumn" : "spring"); }
  else { const wi = (s.d>0?1:0)+(s.c>0?1:0), su = (s.d<0?1:0)+(s.c<0?1:0); season = wi>su ? "winter" : su>wi ? "summer" : (s.d>0||s.c>0 ? "winter" : "summer"); }
  const sh = (a.shoulders||[1])[0], wa = (a.waist||[1])[0];
  let shape;
  if(wa === 3) shape = "O";
  else if(g === "w") shape = sh===0 ? "V" : sh===2 ? "A" : (wa===0 ? "X" : "H");
  else shape = sh===2 ? "A" : sh===0 ? (wa===0 ? "V" : "X") : (wa<=1 ? "X" : "H");
  const h = parseInt((a.size||{}).h, 10);
  let hc = "mid";
  if(h){ const lo = g==="m"?172:160, hi = g==="m"?185:175; hc = h<lo ? "petite" : h>=hi ? "tall" : "mid"; }
  const styles = (a.styles||[]).map(j => STYLES[j][0]);
  return {g, season, shape, hc, styles, neutral: Math.abs(s.w) <= 1};
}
function roleColor(season, role, shift=0){
  const s = SEASONS[season];
  if(role === "metal") return [s.mhex, X(s.metal), X(s.metal), X(s.metal)];
  if(role[0] === "n") return s.neutral[+role[1]];
  return s.best[(+role[1]*3 + shift) % s.best.length];
}
function fitsFor(p){ return TRENDS.filter(tr => tr.g==="b" || tr.g===p.g).map(tr => [tr, tr.fit(p)]); }
function renderResult(){
  const t = L(), r = score();
  profile = r; store.set("styleai-profile", r);
  const s = SEASONS[r.season], sh = SHAPES[r.g][r.shape];
  const styleNames = r.styles.map(k => X(STYLES.find(x=>x[0]===k)[1]));
  const capsule = CAPSULE[r.g].map(([n,role]) => { const c = roleColor(r.season, role); return `<li>${swatch(c,{sm:true})}<span>${esc(X(n))} <span class="fine">· ${esc(cn(c))}</span></span></li>`; }).join("");
  const pieces = r.styles.map(k => { const row = STYLES.find(x=>x[0]===k); return `<li><span><em>${esc(X(row[1]))}</em> — ${esc(X(r.g==="m"?row[3]:row[2]))}</span></li>`; }).join("");
  const tr = fitsFor(r).filter(([,f]) => f[0]==="yes").slice(0,3).map(([x,f]) => `<li><span><em>${esc(X(x.name))}</em> — ${esc(X(f[1]))}</span></li>`).join("");
  const hTip = r.hc!=="mid" ? `<p class="fine">${esc(X(HEIGHT[r.g][r.hc]))}</p>` : "";
  const summary = t.rSummary(X(s.name), X(s.sub), X(sh.name), styleNames.join(", "));
  qEl.innerHTML = `<div class="result">
    <div class="hd"><span class="label">${esc(t.rEyebrow)}</span><h3>${esc(X(s.name))} <em>·</em> ${esc(X(sh.name))}</h3>
      <span class="label">${esc(X(s.sub))}${styleNames.length?` · ${esc(styleNames.join(", "))}`:""}</span></div>
    <div class="strip" aria-label="${esc(t.rColors)}">${strip(s.best, -1)}</div>
    <div class="rgrid">
      <div><span class="label">${esc(t.rShape)}</span><p>${esc(X(sh.goal))}</p><ul class="rlist">${X(sh.good).slice(0,3).map(x=>`<li>— ${esc(x)}</li>`).join("")}</ul></div>
      <div><span class="label">${esc(t.rNeutral)} · ${esc(t.rAvoid)} · ${esc(t.rMetal)}</span>
        <div class="dots">${s.neutral.map(c=>swatch(c)).join("")}</div><div class="dots">${s.avoid.map(c=>swatch(c,{x:true})).join("")}</div><p class="fine">${esc(X(s.metal))}</p></div>
      <div><span class="label">${esc(t.rCapsule)}</span><ul class="rlist">${capsule}</ul></div>
      <div>${pieces?`<span class="label">${esc(t.rStylePieces)}</span><ul class="rlist">${pieces}</ul>`:""}
        ${tr?`<span class="label">${esc(t.rTrends)}</span><ul class="rlist">${tr}</ul>`:""}</div>
    </div>
    ${hTip}${r.neutral?`<p class="fine">${esc(t.rNeutralNote)}</p>`:""}
    <p class="fine">${esc(t.rFine)}</p>
    <div class="qnav"><div style="display:flex;gap:1rem;flex-wrap:wrap"><a class="btn" href="#looks">${esc(t.rToOutfits)}</a><a class="btn line" href="#probe">${esc(t.rToDrape)}</a></div>
      <div style="display:flex;gap:1.5rem"><button class="cta" id="q-copy">${esc(t.rCopy)}</button><button class="cta" id="q-redo">${esc(t.rRedo)}</button></div></div>
    <span class="copied" id="q-copied" hidden>${esc(t.rCopied)}</span>
    <p class="fine" id="q-sum" hidden>${esc(summary)}</p></div>`;
  $("#q-redo").onclick = () => { st = {i:0,a:{}}; saveQ(); renderQuiz(); };
  $("#q-copy").onclick = () => {
    const ok = () => { $("#q-copied").hidden = false; };
    const fb = () => { const p=$("#q-sum"); p.hidden=false; const g=document.createRange(); g.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(g); };
    try{ navigator.clipboard.writeText(summary).then(ok, fb); }catch(e){ fb(); }
  };
  /* the rest of the page follows the new profile */
  if(!syncedOnce){ syncedOnce = true; ctSeason = r.season; fgG = r.g; fgShape = r.shape; dpSeason = r.season; renderSeasons(); renderFigure(); renderDrape(); }
  renderOutfit(); renderTrends();
}
let syncedOnce = false;

/* ---------- colour drape with photo ---------- */
let dpSeason = P().season, dpA = 0, dpB = 0, photoUrl = null;
const DEMO_FACE = {src:"img/mature-woman.jpg", z:2.3, ox:"64%", oy:"30%"};
function renderDrape(){
  const s = SEASONS[dpSeason];
  pills($("#dpSeasons"), SKEYS.map(k => [k, X(SEASONS[k].name)]), dpSeason, k => { dpSeason = k; dpA = 0; dpB = 0; renderDrape(); });
  $("#dpBest").innerHTML = s.best.map((c,i) => swatch(c,{btn:true,i,on:i===dpA})).join("");
  $("#dpAvoid").innerHTML = s.avoid.map((c,i) => swatch(c,{btn:true,i,on:i===dpB})).join("");
  $("#dpBest").querySelectorAll("button").forEach(b => b.onclick = () => { dpA = +b.dataset.i; renderDrape(); });
  $("#dpAvoid").querySelectorAll("button").forEach(b => b.onclick = () => { dpB = +b.dataset.i; renderDrape(); });
  $("#dA").style.setProperty("--c", s.best[dpA][0]); $("#dB").style.setProperty("--c", s.avoid[dpB][0]);
  $("#dATag").textContent = cn(s.best[dpA]); $("#dBTag").textContent = cn(s.avoid[dpB]);
  const src = photoUrl || DEMO_FACE.src;
  document.querySelectorAll(".drape .face").forEach(f => { if(f.dataset.src !== src){ f.innerHTML = `<img src="${src}" alt="">`; f.dataset.src = src; } });
  applyFrame();
}
function applyFrame(){
  document.querySelectorAll(".drape .face img").forEach(i => {
    if(photoUrl){ i.style.transformOrigin = "50% 50%"; i.style.transform = `scale(${$("#dpZoom").value})`; i.style.objectPosition = `50% ${$("#dpPos").value}%`; }
    else { i.style.transformOrigin = `${DEMO_FACE.ox} ${DEMO_FACE.oy}`; i.style.transform = `scale(${DEMO_FACE.z})`; i.style.objectPosition = "50% 0%"; }
  });
}
$("#dpFile").onchange = e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  if(photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(f); $("#dpRanges").hidden = false; renderDrape();
};
$("#dpZoom").oninput = applyFrame; $("#dpPos").oninput = applyFrame;

/* ---------- outfits ---------- */
let ofOcc = "buero", ofW = "cold", ofShift = 0;
const pick = (item, w) => (item && (item.de !== undefined)) ? item : (item ? item[w] : null);
const LOOK_IMG = {w:{buero:"woman-suit",alltag:"woman-trench",abend:"hero-woman",hochzeit:"mature-woman",interview:"woman-suit"},
                 m:{buero:"man-coat",alltag:"man-street",abend:"man-coat",hochzeit:"man-suit",interview:"man-suit"}};
function renderOutfit(){
  const t = L(), p = P(), s = SEASONS[p.season], o = OUT[p.g][ofOcc];
  pills($("#ofOcc"), OCC.map(([k,n]) => [k, X(n)]), ofOcc, k => { ofOcc = k; renderOutfit(); });
  pills($("#ofWeather"), WEATHER.map(([k,n]) => [k, X(n)]), ofW, k => { ofW = k; renderOutfit(); });
  $("#ofProfile").textContent = (p.demo ? t.ofDemo : t.ofMine)(gName(p.g), X(s.name), X(SHAPES[p.g][p.shape].name));
  const want = `img/${LOOK_IMG[p.g][ofOcc]}.jpg`; if(!$("#ofImg").src.endsWith(want)) $("#ofImg").src = want;
  const cols = []; let rows = "", nearFace = null;
  o.items.forEach(([slot, item, role]) => {
    const it = pick(item, ofW); if(!it) return;
    const col = roleColor(p.season, role, ofShift);
    if(role!=="metal") cols.push(col[0]);
    if(!nearFace && role[0]==="a" && ["top","dress","acc"].includes(slot)) nearFace = col;
    rows += `<li><span class="slot">${esc(X(SLOTS[slot]))}</span><span class="it">${esc(X(it))}</span><span class="col"><span class="dot sm" style="--c:${col[0]}"></span>${esc(role==="metal" ? "" : cn(col))}</span></li>`;
  });
  $("#ofList").innerHTML = rows;
  $("#ofBar").innerHTML = cols.map(c => `<i style="--c:${c}"></i>`).join("");
  const why = [];
  if(nearFace) why.push(t.whyColor(cn(nearFace)));
  why.push(t.whyBase(cn(s.neutral[3]), cn(s.neutral[1])));
  why.push(t.whyMetal(X(s.metal)));
  const sh = SHAPES[p.g][p.shape]; why.push(X(sh.goal));
  if(p.hc && p.hc!=="mid") why.push(X(HEIGHT[p.g][p.hc]));
  why.push(X(o.rule));
  $("#ofWhy").innerHTML = why.map(x=>`<li>${esc(x)}</li>`).join("");
}
$("#ofShuffle").onclick = () => { ofShift = (ofShift+1) % 8; renderOutfit(); };

/* ---------- trends ---------- */
let trFilter = "all";
const FEAT = [[0,"plaid"],[3,"knit"],[7,"man-street"],[8,"man-coat"]];
function renderTrends(){
  const t = L(), p = P();
  const sName = X(SEASONS[p.season].name), shName = X(SHAPES[p.g][p.shape].name);
  $("#trProfile").textContent = (p.demo ? t.trDemo : t.trMine)(sName, shName);
  const fit = tr => tr.fit({...p, g: tr.g==="b" ? p.g : tr.g});
  $("#trFeat").innerHTML = FEAT.map(([i,img]) => { const tr = TRENDS[i], f = fit(tr);
    return `<article class="tcard"><div class="ph"><img src="img/${img}.jpg" alt="" loading="lazy" width="800" height="992"></div>
      <span class="tag ${f[0]}">${esc(f[0]==="yes"?t.trYes:t.trAdapt)}</span><h3>${esc(X(tr.name))}</h3><p class="tip">${esc(X(f[1]))}</p></article>`; }).join("");
  pills($("#trFilter"), [["all",t.trAll],["w",t.gw],["m",t.gm]], trFilter, k => { trFilter = k; renderTrends(); });
  const featIdx = FEAT.map(x=>x[0]);
  $("#trList").innerHTML = TRENDS.map((tr,i) => [tr,i]).filter(([tr,i]) => !featIdx.includes(i) && (trFilter==="all" || tr.g==="b" || tr.g===trFilter)).map(([tr]) => { const f = fit(tr);
    return `<article><h3>${esc(X(tr.name))}</h3><p class="tip">${esc(X(f[1]))}</p><span class="tag ${f[0]}">${esc(f[0]==="yes"?t.trYes:t.trAdapt)}</span></article>`; }).join("");
}

/* reveal on scroll */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12}) : null;
document.querySelectorAll(".rv").forEach(n => io ? io.observe(n) : n.classList.add("in"));

applyLang();
if(st.i >= QL.length) syncedOnce = true;
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
