/* STYLEMAKER · editorial luxury: ivory paper, ink, one champagne accent.
   Big photography, very little text, hairlines instead of boxes. */
:root{
  --bg:#F4F0EA;--paper:#FBF9F5;--ink:#141210;--soft:#6F675F;--line:#DCD4C8;--accent:#A9834F;--dark:#141210;--on-dark:#EFE9E0;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(20px,5vw,72px);--gap:clamp(4rem,10vw,9rem);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.04;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(3.2rem,8.4vw,8.2rem)}
h2{font-size:clamp(2.4rem,5.2vw,4.6rem)}
h3{font-size:clamp(1.4rem,2vw,1.9rem);line-height:1.15}
em{font-style:italic}
h1 span{display:block}
.dark .dot{border-color:rgba(255,255,255,.28)}
p{margin:0}
.label{font-size:.7rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:1.1rem;letter-spacing:.02em}
.lead{font-size:clamp(1.05rem,1.4vw,1.2rem);color:var(--soft);max-width:34ch;line-height:1.6}
.fine{font-size:.82rem;color:var(--soft)}
.skip{position:absolute;left:-999px;top:0;z-index:50;background:var(--ink);color:var(--bg);padding:.6rem 1rem}
.skip:focus{left:0}
.proto{background:var(--ink);color:var(--on-dark);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:.55rem var(--pad)}

/* links that act as buttons */
.cta{display:inline-flex;align-items:center;gap:.9rem;font-size:.74rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;padding:1rem 0;border:0;background:none;border-bottom:1px solid currentColor}
.cta::after{content:"→";letter-spacing:0;font-size:1rem;transition:transform .35s}
.cta:hover::after{transform:translateX(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.8rem;font-size:.72rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;padding:1.1rem 2.1rem;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:background .3s,color .3s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.25;pointer-events:none}

/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.6rem var(--pad);border-bottom:1px solid var(--line)}
.top nav{display:flex;gap:2rem}
.top nav a,.lang button{font-size:.68rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;color:var(--soft);transition:color .25s}
.top nav a:hover{color:var(--ink)}
.logo{font-family:var(--display);font-size:1.45rem;letter-spacing:.42em;text-decoration:none;white-space:nowrap;padding-left:.42em}
.logo em{font-style:italic;text-transform:none;letter-spacing:.02em;margin:0 0 0 -.12em;color:var(--accent)}
.lang{display:flex;gap:1.1rem;justify-content:flex-end}
.lang button{background:none;border:0;padding:.3rem 0;border-bottom:1px solid transparent}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 110px);border-bottom:1px solid var(--line)}
.hero-copy{display:flex;flex-direction:column;justify-content:space-between;gap:3rem;padding:clamp(3rem,7vw,6rem) var(--pad)}
.hero-copy h1 em{color:var(--accent)}
.hero-copy .stack{display:flex;flex-direction:column;gap:2rem}
.hero-img{position:relative;overflow:hidden;background:#d9d6d1}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.hero-meta{display:flex;justify-content:space-between;gap:2rem;align-items:flex-end;flex-wrap:wrap}

/* generic section */
.sec{padding:var(--gap) var(--pad);border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem 4rem;align-items:end;margin-bottom:clamp(3rem,6vw,5rem)}
.sec-head .left{display:flex;flex-direction:column;gap:1.4rem}
.sec-head .lead{justify-self:end}
.dark{background:var(--dark);color:var(--on-dark);border-color:#2a2622}
.dark .label,.dark .lead,.dark .fine{color:#A9A196}

/* manifesto */
.manifesto{padding:var(--gap) var(--pad);text-align:center;border-bottom:1px solid var(--line)}
.manifesto p{font-family:var(--display);font-size:clamp(1.8rem,3.6vw,3.3rem);line-height:1.2;max-width:22ch;margin:0 auto}
.manifesto p em{color:var(--accent)}

/* triptych */
.trip{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,28px)}
.trip figure{margin:0;display:flex;flex-direction:column;gap:1rem}
.trip .ph{overflow:hidden;aspect-ratio:4/5;background:#ddd}
.trip img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.trip figure:hover img{transform:scale(1.04)}
.trip figure:nth-child(2){margin-top:clamp(2rem,6vw,6rem)}
.trip figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}

/* split feature */
.feature{display:grid;grid-template-columns:5fr 7fr;gap:clamp(2rem,6vw,7rem);align-items:start}
.feature>*{min-width:0}
.feature .ph{overflow:hidden;aspect-ratio:4/5;background:#ddd;position:sticky;top:2rem}
.feature .ph img{width:100%;height:100%;object-fit:cover}
.panel{display:flex;flex-direction:column;gap:2.4rem}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem 2rem;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:.9rem 0;margin-bottom:-1px;border-bottom:1px solid transparent;font-size:.72rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);transition:color .25s,border-color .25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.dark .tabs{border-color:#2f2a25}
.dark .tabs button[aria-pressed="true"]{color:var(--on-dark);border-color:var(--on-dark)}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.title-row h3{font-size:clamp(2rem,3.4vw,3rem)}

/* palette strip */
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:0;height:clamp(110px,14vw,170px)}
.strip button{border:0;padding:0;background:var(--c);position:relative;transition:flex .3s}
.strip button::after{content:attr(data-n);position:absolute;left:.6rem;bottom:.55rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92);opacity:0;transition:opacity .25s;text-shadow:0 1px 2px rgba(0,0,0,.25);text-align:left;line-height:1.3;max-width:90%}
.strip button:hover::after,.strip button[aria-pressed="true"]::after{opacity:1}
.strip button.light::after{color:rgba(20,18,16,.8);text-shadow:none}
.strip button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--ink)}
.minis{display:flex;gap:2.5rem;flex-wrap:wrap}
.minis>div{display:flex;flex-direction:column;gap:.7rem}
.dots{display:flex;gap:.4rem}
.dot{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.2);position:relative;flex:none}
.dot.sm{width:.8rem;height:.8rem}
.dot.x::after{content:"";position:absolute;left:50%;top:-12%;width:1px;height:124%;background:var(--ink);transform:rotate(45deg)}
.kv{display:grid;grid-template-columns:9rem 1fr;border-top:1px solid var(--line)}
.kv dt,.kv dd{margin:0;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.kv dt{font-size:.66rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);padding-top:1.35rem}
.kv ul{margin:0;padding:0;list-style:none;display:grid;gap:.35rem}

/* silhouette */
.sil{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr);gap:clamp(2rem,4vw,4rem);align-items:start}
.sil svg{width:100%;height:auto}
.body-line{fill:none;stroke:var(--ink);stroke-width:1}
.guide{stroke:var(--accent);stroke-width:1;stroke-dasharray:2 6}
.cap{font-family:var(--mono);font-size:11px;fill:var(--soft);letter-spacing:.08em}

/* quiz (dark chapter) */
.quiz{max-width:46rem;margin:0 auto;min-height:24rem}
.progress{height:1px;background:#2f2a25;margin-bottom:2.5rem}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.qmeta{display:flex;justify-content:space-between;margin-bottom:1.2rem}
.quiz h3{font-size:clamp(1.8rem,3.2vw,2.6rem);margin-bottom:2.4rem}
.opts{display:grid;gap:0;border-top:1px solid #2f2a25}
.opts.two{grid-template-columns:1fr 1fr;column-gap:2rem}
.opt{text-align:left;background:none;border:0;border-bottom:1px solid #2f2a25;padding:1.15rem 0;display:flex;justify-content:space-between;gap:1rem;color:var(--on-dark);transition:color .2s,padding .3s}
.opt::after{content:"";width:.55rem;height:.55rem;border:1px solid #6d655c;border-radius:50%;flex:none;margin-top:.45rem}
.opt:hover{padding-left:.5rem}
.opt[aria-pressed="true"]{color:var(--accent)}
.opt[aria-pressed="true"]::after{background:var(--accent);border-color:var(--accent)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:3rem;flex-wrap:wrap}
.dark .btn{background:var(--on-dark);color:var(--ink);border-color:var(--on-dark)}
.dark .btn:hover{background:transparent;color:var(--on-dark)}
.dark .btn.line{background:transparent;color:var(--on-dark);border-color:#5b544c}
.dark .btn.line:hover{border-color:var(--on-dark)}
.dark .cta{color:var(--on-dark)}
.start{display:flex;flex-direction:column;gap:2.2rem;text-align:center;align-items:center}
.start h3{margin:0}
.fields{display:flex;gap:2.5rem;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:.5rem}
.field input{background:transparent;border:0;border-bottom:1px solid #5b544c;padding:.6rem 0;width:12rem;font-family:var(--display);font-size:1.8rem;color:var(--on-dark)}
.field input:focus{outline:none;border-color:var(--accent)}
.result{display:flex;flex-direction:column;gap:2.6rem}
.result .hd{display:flex;flex-direction:column;gap:.8rem}
.result h3{margin:0;font-size:clamp(2.2rem,4vw,3.4rem)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem 3rem;border-top:1px solid #2f2a25;padding-top:2.4rem}
.rgrid>div{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.rlist{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.rlist li{display:flex;gap:.7rem;align-items:center}
.result .strip{height:70px}
.copied{font-size:.8rem;color:var(--accent)}

/* drape */
.drapes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,20px)}
.drape{position:relative;aspect-ratio:4/5;background:var(--c);transition:background .5s;overflow:hidden}
.drape .face{position:absolute;left:50%;top:12%;width:64%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;overflow:hidden;background:#cfc8c0}
.drape .face img{width:100%;height:100%;object-fit:cover}
.drape .tag{position:absolute;left:0;right:0;bottom:0;padding:.9rem 1rem;display:flex;justify-content:space-between;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.95);background:linear-gradient(transparent,rgba(0,0,0,.28))}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.range{display:grid;grid-template-columns:auto 1fr;gap:.8rem 1.4rem;align-items:center}
.range input{accent-color:var(--ink)}

/* outfits */
.look{display:grid;grid-template-columns:7fr 5fr;gap:clamp(2rem,6vw,7rem);align-items:start}
.look>*{min-width:0}
.look .ph{aspect-ratio:4/5;overflow:hidden;background:#ddd;position:relative}
.look .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.look .ph .bar{position:absolute;left:0;right:0;bottom:0;display:flex;height:12px}
.look .ph .bar i{flex:1;background:var(--c)}
.olist{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.olist li{display:grid;grid-template-columns:8rem 1fr auto;gap:1rem;align-items:baseline;padding:1.05rem 0;border-bottom:1px solid var(--line)}
.olist .slot{font-size:.64rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.olist .it{font-family:var(--display);font-size:1.25rem;line-height:1.25}
.olist .col{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--soft);white-space:nowrap}
.why{display:grid;gap:.6rem;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:1.6rem 1fr;color:var(--soft);font-size:.95rem}
.why li::before{content:"—";color:var(--accent)}
.row{display:flex;gap:2.5rem;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}

/* trends */
.tfeat{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,28px);margin-bottom:clamp(3rem,6vw,5rem)}
.tcard{display:flex;flex-direction:column;gap:1rem;min-width:0}
.tcard .ph{aspect-ratio:3/4;overflow:hidden;background:#ddd}
.tcard img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tcard:hover img{transform:scale(1.04)}
.tcard h3{font-size:1.35rem}
.tag{font-size:.6rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.tag.yes{color:var(--accent)}
.tag.adapt{color:var(--soft)}
.tip{font-size:.92rem;color:var(--soft)}
.tlist{border-top:1px solid var(--line)}
.tlist article{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr) 9rem;gap:2rem;padding:1.5rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.tlist h3{font-size:1.35rem}

/* membership, privacy, faq */
.tiers{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tier{padding:3rem 0;display:flex;flex-direction:column;gap:1.6rem}
.tier+.tier{border-left:1px solid var(--line);padding-left:clamp(2rem,4vw,4rem)}
.price{font-family:var(--display);font-size:clamp(3rem,6vw,5rem);line-height:1}
.tier ul{margin:0;padding:0;list-style:none;display:grid;gap:.7rem}
.tier li{display:grid;grid-template-columns:1.6rem 1fr}
.tier li::before{content:"—";color:var(--accent)}
.tier.alt{color:var(--soft)}
.trusts{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5rem;border-top:1px solid #2f2a25;padding-top:2.5rem}

.trust h3{font-size:1.3rem}
.faq{border-top:1px solid var(--line);max-width:56rem}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:2rem;padding:1.4rem 0;font-family:var(--display);font-size:clamp(1.2rem,1.8vw,1.5rem)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--body);font-weight:300;font-size:1.5rem;line-height:1;color:var(--accent);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 1.5rem;color:var(--soft);max-width:60ch}

footer{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end;padding:4rem var(--pad) 3rem;background:var(--dark);color:var(--on-dark)}
footer .logo{font-size:clamp(2.2rem,6vw,5rem);letter-spacing:.3em}
footer .meta{display:flex;flex-direction:column;gap:.6rem;align-items:flex-end;text-align:right}
footer .meta p,footer .meta a{font-size:.72rem;letter-spacing:.14em;color:#A9A196;text-decoration:none}
footer .meta a:hover{color:var(--on-dark)}
footer .links{display:flex;gap:1.6rem;flex-wrap:wrap;justify-content:flex-end}


/* ===== structure: sticky step navigation, how-it-works, steps with sub-tabs ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(244,240,234,.98);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);grid-template-columns:1fr auto 1fr;padding:1.1rem var(--pad)}
.top .logo{justify-self:start;padding-left:0;font-size:1.25rem}
.steps-nav{display:flex;gap:2.4rem;align-items:center}
.steps-nav a,.mobile-steps a{display:inline-flex;align-items:baseline;gap:.55rem;font-size:.68rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;color:var(--soft);padding:.4rem 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.steps-nav .n,.mobile-steps .n{font-family:var(--display);font-style:italic;font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--accent)}
.steps-nav a:hover{color:var(--ink)}
.steps-nav a.on,.mobile-steps a.on{color:var(--ink);border-color:var(--ink)}
.steps-nav a.plain{padding-left:2.4rem;border-left:1px solid var(--line)}
html{scroll-padding-top:5rem}

.how{padding:clamp(3.5rem,8vw,6.5rem) var(--pad);border-bottom:1px solid var(--line)}
.how-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1rem;margin-bottom:clamp(2.5rem,5vw,4rem)}
.how-head h2{font-size:clamp(2rem,4vw,3.4rem)}
.how-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.how-steps li+li{border-left:1px solid var(--line)}
.how-steps a{display:flex;flex-direction:column;gap:.9rem;padding:2.4rem clamp(1.2rem,3vw,2.8rem);text-decoration:none;height:100%;transition:background .35s}
.how-steps a:hover{background:var(--paper)}
.how-steps .num{font-size:2.6rem;line-height:1}
.how-steps h3{font-size:1.7rem}
.how-steps p{color:var(--soft);max-width:30ch}
.how-steps .go{margin-top:auto;padding-top:1rem;font-size:.66rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
.how-steps .go::after{content:" →";letter-spacing:0}

.step-head{display:flex;flex-direction:column;align-items:flex-start;gap:1.1rem;margin-bottom:clamp(2rem,4vw,3rem);max-width:50rem}
.stepno{font-size:.68rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.dark .stepno{color:var(--accent)}
.step-head .lead{max-width:44ch}
#test .step-head{align-items:center;text-align:center;margin-left:auto;margin-right:auto}
.status{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;background:var(--paper);border:1px solid var(--line);margin-bottom:2.2rem}
.status p{margin:0}
.status .who{font-family:var(--display);font-size:1.25rem}
.status .who em{color:var(--accent)}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:clamp(2rem,4vw,3rem);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:1.1rem 2.2rem 1.1rem 0;margin-right:2.2rem;display:flex;align-items:baseline;gap:.7rem;font-family:var(--display);font-size:clamp(1.3rem,2.2vw,1.8rem);color:var(--soft);white-space:nowrap;transition:color .25s,border-color .25s}
.subtabs button .num{font-size:1rem}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabpanel{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro{color:var(--soft);font-size:1.05rem;max-width:46ch}
.choose{display:flex;flex-direction:column;gap:.4rem}
.choose .tabs{margin-top:-.2rem}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,5rem);margin-top:clamp(4rem,8vw,7rem)}
.info-block{display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.info-block h3{font-size:clamp(1.8rem,3vw,2.6rem)}
.info-block h3 em{color:var(--accent)}
#faq.info-block{margin-top:clamp(4rem,8vw,7rem)}
.info-block .tiers{margin-top:.6rem}
.trust-list{list-style:none;margin:.6rem 0 0;padding:0;border-top:1px solid var(--line)}
.trust-list li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1rem;padding:1.05rem 0;border-bottom:1px solid var(--line)}
.trust-list b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.trust-list span{color:var(--soft);font-size:.92rem}

.mobile-steps{display:none}
@media (max-width:980px){
  .steps-nav{display:none}
  .top{grid-template-columns:1fr auto}
  .how-steps{grid-template-columns:1fr}
  .how-steps li+li{border-left:0;border-top:1px solid var(--line)}
  .how-steps a{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:.3rem 1.2rem;padding:1.6rem 0}
  .how-steps p{flex-basis:100%;padding-left:3.6rem}
  .how-steps .go{display:none}
  .info-grid{grid-template-columns:1fr}
  .mobile-steps{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;bottom:0;z-index:40;background:rgba(244,240,234,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .mobile-steps a{justify-content:center;padding:.95rem 0;border-bottom:0;border-top:2px solid transparent;font-size:.62rem}

}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

@media (max-width:980px){

  .tiers{grid-template-columns:1fr}

}
