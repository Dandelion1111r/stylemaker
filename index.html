/* Layout: editorial two-column sections (label column + content column), like SKIN AI.
   The colour drape and the silhouette are the bold objects; everything else stays quiet. */
:root{
  --bg:#F6F3EF;--surface:#FFFFFF;--ink:#221D19;--muted:#5E554E;--line:#E3DCD4;
  --accent:#8A4B2C;--accent-soft:#F3E8E0;--warn:#8F5A1F;
  --ok:#3D6A4C;--ok-bg:#E7F1EA;--mid:#8A5A1E;--mid-bg:#F7EDDF;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s1:.5rem;--s2:1rem;--s3:1.5rem;--s4:2.5rem;--s5:4.5rem;--radius:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17130F;--surface:#211B16;--ink:#F2ECE6;--muted:#B8ACA2;--line:#382F28;
  --accent:#E3A882;--accent-soft:#33251C;--warn:#E5B07A;--ok:#8FC6A0;--ok-bg:#1F2E24;--mid:#E6B676;--mid-bg:#33281A;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:72rem;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,5.2vw,4.25rem);letter-spacing:-.01em}
h1 span{display:block}
h1 em{color:var(--accent)}
h2{font-size:clamp(1.9rem,3.4vw,2.75rem)}
h3{font-size:1.35rem;line-height:1.25}
p{margin:0;max-width:62ch}
a{color:var(--accent)}
.eyebrow{font-weight:500;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mono{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.muted{color:var(--muted)}
.fine{font-size:.88rem;color:var(--muted)}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;z-index:50;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:0 0 6px 0}
.skip:focus{left:0}
.proto-bar{background:var(--ink);color:var(--bg);font-size:.82rem;line-height:1.5;padding:.6rem max(16px,env(safe-area-inset-left,0px));margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));text-align:center}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2) var(--s4);flex-wrap:wrap;padding-block:1.25rem;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:500;font-size:1.35rem;letter-spacing:.28em;color:var(--ink);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:.6rem}
.logo .mark{width:1.5rem;height:1.5rem;color:var(--ink)}
.logo .mark-dot{fill:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.top nav{display:flex;gap:var(--s3);flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none;font-size:.92rem}
.top nav a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:transparent;border:0;color:var(--muted);padding:.25rem .7rem;border-radius:999px;font-size:.8rem;font-weight:500;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:7fr 5fr;gap:var(--s5);align-items:center;padding-block:var(--s5)}
.hero-copy{min-width:0;display:flex;flex-direction:column;gap:var(--s3)}
.lead{font-size:1.15rem;color:var(--muted)}
.btns{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:.8rem 1.5rem;border-radius:999px;font-weight:500;font-size:.95rem;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:not(.ghost):hover{opacity:.9}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.profile{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.profile .ph{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.profile dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.profile dt,.profile dd{padding-block:.7rem;border-bottom:1px solid var(--line);margin:0}
.profile dt{color:var(--muted);font-size:.92rem;padding-right:var(--s2)}
.profile dd{text-align:right;font-weight:500;min-width:0}
.profile dt:last-of-type,.profile dd:last-of-type{border-bottom:0}

/* swatches */
.sws{display:flex;flex-wrap:wrap;gap:.45rem}
.sw{width:2rem;height:2rem;border-radius:50%;border:1px solid rgba(0,0,0,.14);flex:none;padding:0;background:var(--c)}
button.sw{cursor:pointer}
button.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw.sm{width:1.35rem;height:1.35rem}
.sw.x{position:relative;opacity:.85}
.sw.x::after{content:"";position:absolute;left:50%;top:-10%;width:1.5px;height:120%;background:var(--ink);transform:rotate(45deg)}
.dot{display:inline-block;width:.85rem;height:.85rem;border-radius:50%;border:1px solid rgba(0,0,0,.15);background:var(--c);vertical-align:-.1em;flex:none}

/* sections */
section{display:grid;grid-template-columns:4fr 8fr;gap:var(--s3) var(--s5);padding-block:var(--s5);border-top:1px solid var(--line)}
section>*{min-width:0}
.sec-head{display:flex;flex-direction:column;gap:var(--s2);align-self:start}
section.wide{grid-template-columns:1fr}
section.wide .sec-head{max-width:46rem}

.steps{list-style:none;margin:0;padding:0;display:grid;counter-reset:s}
.steps li{display:grid;grid-template-columns:4rem 1fr;gap:var(--s2);padding-block:var(--s3);border-bottom:1px solid var(--line)}
.steps li:first-child{padding-top:0}
.steps li:last-child{border-bottom:0;padding-bottom:0}
.steps li::before{counter-increment:s;content:"0" counter(s);font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--accent)}
.steps li div{display:flex;flex-direction:column;gap:.35rem;min-width:0}

/* tabs / pills */
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.92rem}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabgroup{display:flex;flex-direction:column;gap:.6rem}
.split{display:grid;grid-template-columns:5fr 7fr;gap:var(--s5);align-items:start}
.split>*{min-width:0}
.detail{display:flex;flex-direction:column;gap:var(--s3)}
.detail h3{font-size:1.75rem}
.kv{display:grid;grid-template-columns:8.5rem 1fr;margin:0}
.kv dt,.kv dd{margin:0;padding-block:.75rem;border-top:1px solid var(--line)}
.kv dt{font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:.95rem}
.kv dd{min-width:0}
.kv ul{margin:0;padding-left:1.1rem}
.visual{padding:0;overflow:hidden;display:flex;justify-content:center;align-items:center;background:var(--accent-soft)}
.visual svg{width:100%;height:auto;display:block}
.cap-label{font-family:var(--mono);font-size:.75rem;fill:var(--ink)}

/* quiz */
.quiz{padding:var(--s4)}
.progress{height:2px;background:var(--line);margin-bottom:var(--s3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:var(--s2);margin-bottom:.75rem}
.quiz h3{margin-bottom:var(--s3);font-size:1.6rem}
.opts{display:grid;gap:.6rem}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:.85rem 1.1rem;display:flex;align-items:center;gap:.8rem}
.opt::before{content:"";flex:none;width:.9rem;height:.9rem;border:1px solid var(--muted);border-radius:50%}
.opts.multi .opt::before{border-radius:3px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.qnav{display:flex;justify-content:space-between;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap}
.start{display:flex;flex-direction:column;gap:var(--s3)}
.bul{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.bul li{display:flex;gap:.75rem}
.bul li::before{content:"";flex:none;width:.4rem;height:.4rem;margin-top:.65rem;border-radius:50%;background:var(--accent)}
.field{display:flex;flex-direction:column;gap:.35rem}
.field input{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:.75rem .9rem;width:100%;max-width:14rem}
.fields{display:flex;gap:var(--s3);flex-wrap:wrap}

/* result */
.result{display:flex;flex-direction:column;gap:var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:.25rem .85rem;font-size:.88rem;font-weight:500}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);padding-block:var(--s3);border-block:1px solid var(--line)}
.rgrid>div{min-width:0;display:flex;flex-direction:column;gap:.6rem}
.rlist{margin:0;padding:0;list-style:none;display:grid;gap:.45rem}
.rlist li{display:flex;gap:.6rem;align-items:baseline}
.note{border-left:2px solid var(--warn);padding-left:var(--s2)}
.note b{color:var(--warn);font-weight:500}
.copied{font-size:.88rem;color:var(--accent)}

/* photo drape */
.drape-wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.drape{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:var(--c);transition:background .35s;border:1px solid var(--line)}
.drape .face{position:absolute;left:50%;top:10%;width:62%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;overflow:hidden;background:#D8CEC6;box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.drape .face img{width:100%;height:100%;object-fit:cover;transform-origin:center}
.drape .face svg{width:100%;height:100%}
.drape .tag{position:absolute;left:.75rem;bottom:.75rem;background:rgba(255,255,255,.92);color:#221D19;border-radius:999px;padding:.25rem .8rem;font-size:.82rem;font-weight:500}
.drape .tag.bad{background:rgba(34,29,25,.85);color:#fff}
.dctl{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.dctl label.upl{align-self:flex-start}
.dctl input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.range{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.range input{flex:1 1 10rem;accent-color:var(--accent)}

/* outfits */
.outfit{display:grid;grid-template-columns:10rem 1fr;gap:var(--s4);padding:var(--s4);align-items:start}
.outfit>*{min-width:0}
.fig svg{width:100%;height:auto}
.olist{margin:0;padding:0;list-style:none;display:grid}
.olist li{display:grid;grid-template-columns:7.5rem 1fr;gap:.5rem;padding-block:.6rem;border-top:1px solid var(--line)}
.olist li:first-child{border-top:0;padding-top:0}
.olist .slot{font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:.2rem}
.olist .it{display:flex;gap:.55rem;align-items:baseline;flex-wrap:wrap}
.olist small{color:var(--muted)}
.why{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.6rem}
.octl{display:grid;gap:var(--s2);margin-bottom:var(--s3)}

/* trends */
.trends{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.trend{padding:var(--s3);display:flex;flex-direction:column;gap:.6rem;min-width:0}
.trend h3{font-size:1.3rem}
.badge{align-self:flex-start;font-size:.78rem;font-weight:500;border-radius:999px;padding:.15rem .7rem}
.badge.yes{color:var(--ok);background:var(--ok-bg)}
.badge.adapt{color:var(--mid);background:var(--mid-bg)}
.tip{border-left:2px solid var(--accent);padding-left:.8rem;font-size:.95rem}

/* phones */
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);justify-items:center}
.phones figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--s2);width:100%;max-width:290px}
.phones figcaption{font-size:.92rem;color:var(--muted);text-align:center;max-width:24ch}
.phone{width:100%;aspect-ratio:9/19;border-radius:44px;background:#1E1915;padding:9px;box-shadow:0 40px 60px -40px rgba(34,29,25,.55)}
.screen{height:100%;border-radius:35px;background:#FAF8F5;color:#221D19;overflow:hidden;display:flex;flex-direction:column;font-size:.78rem;line-height:1.4}
.notch{flex:none;width:86px;height:22px;background:#1E1915;border-radius:0 0 14px 14px;margin:0 auto}
.sbody{flex:1;min-height:0;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.a-h{font-family:var(--display);font-size:1.4rem;line-height:1.15}
.a-h2{font-family:var(--display);font-size:1.1rem;line-height:1.2}
.a-muted{color:#7A6E66;font-size:.72rem}
.a-label{font-size:.62rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#8A4B2C;margin-bottom:4px}
.acard{background:#FFFFFF;border:1px solid #ECE4DC;border-radius:16px;padding:11px 12px}
.a-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.a-items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.a-items li{display:flex;gap:8px;align-items:center}
.a-items i{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.a-pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.a-pal i{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.a-warn{align-self:flex-start;font-size:.68rem;font-weight:500;color:#8A5A1E;background:#F7EDDF;border-radius:999px;padding:3px 9px}
.a-ok{align-self:flex-start;font-size:.68rem;font-weight:500;color:#3F6B4E;background:#E5F0E8;border-radius:999px;padding:3px 9px}
.a-ad{font-size:.6rem;color:#7A6E66;border:1px solid #E3D9D0;border-radius:4px;padding:1px 5px}
.a-btn{margin-top:auto;text-align:center;background:#221D19;color:#FAF8F5;border-radius:999px;padding:9px;font-weight:500}
.a-prod{display:flex;justify-content:center;background:#F2ECE6;border-radius:16px;padding:8px}
.tabbar{flex:none;display:flex;justify-content:space-around;padding:9px 6px 16px;border-top:1px solid #ECE4DC;background:#FFFFFF;font-size:.62rem;color:#8A7E76}
.tabbar .on{color:#8A4B2C;font-weight:500}

/* trust + faq + tiers */
.trusts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s3)}
.trust{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.trust svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:.25rem}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding-block:1.1rem;font-family:var(--display);font-size:1.2rem;line-height:1.3}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--body);font-size:1.4rem;color:var(--accent);flex:none;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:1.2rem}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tier{padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.tier.main{border-color:var(--accent)}
.tier.alt{background:transparent}
.tier ul{margin:var(--s1) 0 0;padding:0;list-style:none;display:grid;gap:.6rem}
.tier li{display:flex;gap:.7rem}
.tier li::before{content:"✓";color:var(--accent);flex:none}
.tier.alt li::before{content:"+";color:var(--muted)}
.price{font-family:var(--display);font-size:2.6rem;line-height:1}

footer{border-top:1px solid var(--line);padding-block:var(--s4);display:grid;grid-template-columns:4fr 8fr;gap:var(--s2) var(--s5)}
footer>div{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
footer .legal-links{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;font-size:.85rem}
footer .legal-links a{color:var(--muted);padding-block:.4rem}

@media (max-width:900px){
  section,footer{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;gap:var(--s4);padding-block:var(--s4)}
  .split{grid-template-columns:1fr;gap:var(--s3)}
  .phones{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;justify-content:flex-start;padding-bottom:var(--s2);gap:var(--s3)}
  .phones figure{flex:none;width:250px;scroll-snap-align:center}
  .trends{grid-template-columns:1fr}
}
@media (max-width:600px){
  .top nav{display:none}
  .rgrid,.tiers,.opts.two,.trusts{grid-template-columns:1fr}
  .quiz{padding:var(--s3)}
  .quiz h3{font-size:1.35rem}
  section{padding-block:var(--s4)}
  .kv{grid-template-columns:1fr}
  .kv dt{padding-bottom:0}
  .kv dd{border-top:0;padding-top:.25rem}
  .outfit{grid-template-columns:1fr;padding:var(--s3)}
  .fig{max-width:9rem;margin:0 auto}
  .olist li{grid-template-columns:1fr;gap:.1rem}
  .drape-wrap{gap:.6rem}
  .drape .tag{font-size:.72rem;left:.5rem;bottom:.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ---------- helpers & state ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const LANGS = ["de","ro","en"];
const saved = store.get("styleai-lang");
let lang = LANGS.includes(saved) ? saved : "de";
const L = () => T[lang];
const X = o => o == null ? "" : (o[lang] ?? o.de);
const LI = {de:1,ro:2,en:3};
const cn = sw => sw[LI[lang]];               /* colour name */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const DEMO = {g:"w",season:"summer",shape:"X",hc:"mid",styles:["klassisch","minimal"],demo:true};
let profile = store.get("styleai-profile");
const P = () => profile || DEMO;
const gName = g => g==="m" ? L().gm1 : L().gw1;

function pills(el, items, cur, onPick){
  el.innerHTML = "";
  items.forEach(([k,label]) => {
    const b = document.createElement("button"); b.className = "pill"; b.type = "button";
    b.textContent = label; b.setAttribute("aria-pressed", k===cur);
    b.onclick = () => onPick(k); el.appendChild(b);
  });
}
function swatch(sw, opts={}){
  const tag = opts.btn ? "button" : "span";
  return `<${tag} class="sw${opts.sm?" sm":""}${opts.x?" x":""}" style="--c:${sw[0]}" title="${esc(cn(sw))}" aria-label="${esc(cn(sw))}"${opts.btn?` type="button" data-i="${opts.i}" aria-pressed="${!!opts.on}"`:""}></${tag}>`;
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { const v = L()[n.dataset.t]; if(typeof v === "string") n.textContent = v; });
  document.querySelectorAll("[data-th]").forEach(n => n.innerHTML = L()[n.dataset.th]);
  document.querySelectorAll("[data-tl]").forEach(n => n.innerHTML = L()[n.dataset.tl].map(x=>`<li>${esc(x)}</li>`).join(""));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#heroSw").innerHTML = SEASONS.summer.best.map(s => swatch(s,{sm:true})).join("");
  $("#faqList").innerHTML = L().FAQ.map(([q,a]) => `<details><summary>${esc(q)}</summary><p class="muted">${esc(a)}</p></details>`).join("");
  renderAll();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("styleai-lang", lang); applyLang(); });
function renderAll(){ renderSeasons(); renderFigure(); renderQuiz(); renderDrape(); renderOutfit(); renderTrends(); }

/* ---------- colour types ---------- */
let ctSeason = P().season, ctPick = 0;
function drapeSvg(color){
  return `<svg viewBox="0 0 400 440" role="img" aria-label="${esc(L().ctPicked)}">
    <path d="M30 440 Q40 330 200 300 Q360 330 370 440 Z" fill="${color}"/>
    <path d="M168 248 h64 v62 q-32 22 -64 0 z" fill="#E4D2C4"/>
    <ellipse cx="200" cy="170" rx="72" ry="92" fill="#EADBCF"/>
    <path d="M128 160 Q130 72 200 70 Q270 72 272 160 Q262 108 200 104 Q138 108 128 160 Z" fill="#7C6A5E"/>
    <path d="M150 300 L200 360 L250 300" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="2"/>
  </svg>`;
}
function renderSeasons(){
  const s = SEASONS[ctSeason];
  pills($("#seasons"), SKEYS.map(k => [k, X(SEASONS[k].name)]), ctSeason, k => { ctSeason = k; ctPick = 0; renderSeasons(); });
  $("#seasons").setAttribute("aria-label", L().ctEyebrow);
  $("#ctName").textContent = X(s.name); $("#ctSub2").textContent = X(s.sub);
  $("#ctSigns").textContent = X(s.signs); $("#ctRule").textContent = X(s.rule); $("#ctMetal").textContent = X(s.metal);
  $("#ctBest").innerHTML = s.best.map((c,i) => swatch(c,{btn:true,i,on:i===ctPick})).join("");
  $("#ctNeutral").innerHTML = s.neutral.map(c => swatch(c)).join("");
  $("#ctAvoid").innerHTML = s.avoid.map(c => swatch(c,{x:true})).join("");
  $("#ctPick").textContent = L().ctPicked + cn(s.best[ctPick]);
  $("#ctVisual").innerHTML = drapeSvg(s.best[ctPick][0]);
  $("#ctBest").querySelectorAll("button").forEach(b => b.onclick = () => { ctPick = +b.dataset.i; renderSeasons(); });
}

/* ---------- body shapes ---------- */
let fgG = P().g, fgShape = P().shape;
function smooth(pts){
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){ const m = [(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2]; d += ` Q${pts[i][0]} ${pts[i][1]} ${m[0]} ${m[1]}`; }
  const l = pts[pts.length-1]; return d + ` L${l[0]} ${l[1]}`;
}
function bodySvg(p, g){
  const c = 150, S=62*p.sh, B=54*p.bu, W=48*p.wa, H=58*p.hi, neck = g==="m"?17:14;
  const y = {neck:96,sh:124,bu:172,wa:238,hi:296,kn:430,an:500};
  const right = [[c+neck,y.neck],[c+neck+4,y.sh-12],[c+S,y.sh],[c+S-4,y.sh+18],[c+B,y.bu],[c+W,y.wa],[c+H,y.hi],[c+H*.8,y.hi+50],[c+H*.5,y.kn],[c+20,y.an]];
  const left = right.map(([x,yy]) => [2*c-x,yy]).reverse();
  const path = smooth(right) + " L" + left.map(p=>p.join(" ")).join(" L") + " Z";
  const line = (yy,w,lbl) => `<line x1="${c-w-14}" y1="${yy}" x2="${c+w+14}" y2="${yy}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 5"/><text x="${c+w+20}" y="${yy+4}" class="cap-label">${esc(lbl)}</text>`;
  return `<svg viewBox="0 0 330 520" role="img" aria-label="${esc(X(SHAPES[g][fgShape].name))}">
    <circle cx="${c}" cy="58" r="${g==="m"?30:28}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="${path}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="${c}" y1="${y.hi+38}" x2="${c}" y2="${y.an}" stroke="var(--ink)" stroke-width="1.2"/>
    ${line(y.sh,S,L().lblShoulder)}${line(y.wa,W,L().lblWaist)}${line(y.hi,H,L().lblHip)}
  </svg>`;
}
function renderFigure(){
  pills($("#fgGender"), [["w",L().gw],["m",L().gm]], fgG, k => { fgG = k; renderFigure(); });
  pills($("#fgShapes"), SHKEYS.map(k => [k, X(SHAPES[fgG][k].name)]), fgShape, k => { fgShape = k; renderFigure(); });
  const s = SHAPES[fgG][fgShape];
  $("#fgName").textContent = X(s.name);
  $("#fgSigns").textContent = X(s.signs); $("#fgGoal").textContent = X(s.goal); $("#fgAcc").textContent = X(s.acc);
  $("#fgGood").innerHTML = `<ul>${X(s.good).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#fgBad").innerHTML = `<ul>${X(s.bad).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#fgVisual").innerHTML = bodySvg(s.p, fgG);
}

/* ---------- quiz ---------- */
/* w = warm(+)/cool(-), d = deep(+)/light(-), c = clear(+)/soft(-) */
const QL = [
  {k:"g"},
  {k:"size",form:true},
  {k:"veins",o:[{w:2},{w:-2},{}]},
  {k:"jewel",o:[{w:2},{w:-2},{}]},
  {k:"sun",o:[{d:1},{},{d:-2},{d:2}]},
  {k:"hair",o:[{w:1,d:-2},{w:-2,d:-1},{w:3},{w:2},{d:2},{w:-2}]},
  {k:"eyes",o:[{w:-1,d:-1},{},{w:1},{d:1}]},
  {k:"contrast",o:[{c:2},{},{c:-2}]},
  {k:"shoulders"},
  {k:"waist"},
  {k:"styles",multi:true}
];
let st = store.get("styleai-quiz") || {i:-1,a:{}};
const qEl = $("#quiz");
const saveQ = () => store.set("styleai-quiz", st);
function qOptions(i){
  if(QL[i].k==="styles") return STYLES.map(s => X(s[1]));
  return L().Q[i][1];
}
function renderQuiz(){
  const t = L();
  if(st.i < 0){
    qEl.innerHTML = `<div class="start"><span class="mono">${esc(t.qStartMeta)}</span><h3>${esc(t.qStartTitle)}</h3>
      <ul class="bul">${t.qStartList.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="btns"><button class="btn" id="q-start">${esc(t.qStartBtn)}</button></div></div>`;
    $("#q-start").onclick = () => { st = {i:0,a:{}}; saveQ(); renderQuiz(); };
    return;
  }
  if(st.i >= QL.length) return renderResult();
  const q = QL[st.i], title = t.Q[st.i][0];
  const head = `<div class="progress"><i style="width:${Math.round(st.i/QL.length*100)}%"></i></div>
    <div class="qmeta"><span class="mono">${esc(t.qOf(st.i+1, QL.length))}</span>${q.multi?`<span class="mono">${esc(t.qMulti)}</span>`:""}</div><h3>${esc(title)}</h3>`;
  const isLast = st.i === QL.length-1;
  if(q.form){
    const v = st.a.size || {};
    qEl.innerHTML = head + `<div class="fields">
        <label class="field"><span class="mono">${esc(t.fHeight)}</span><input type="number" id="f-h" inputmode="numeric" min="120" max="230" value="${esc(v.h||"")}" placeholder="170"></label>
        <label class="field"><span class="mono">${esc(t.fWeight)}</span><input type="number" id="f-w" inputmode="numeric" min="30" max="250" value="${esc(v.w||"")}"></label>
      </div><p class="fine" style="margin-top:var(--s2)">${esc(t.fNote)}</p>
      <div class="qnav"><button class="btn ghost" id="q-back">${esc(t.qBack)}</button><div class="btns"><button class="btn ghost" id="q-skip">${esc(t.qSkip)}</button><button class="btn" id="q-next">${esc(t.qNext)}</button></div></div>`;
    const keep = () => { st.a.size = {h: $("#f-h").value, w: $("#f-w").value}; };
    $("#q-back").onclick = () => { keep(); st.i--; saveQ(); renderQuiz(); };
    $("#q-skip").onclick = () => { st.a.size = {}; st.i++; saveQ(); renderQuiz(); };
    $("#q-next").onclick = () => { keep(); st.i++; saveQ(); renderQuiz(); };
    return;
  }
  const opts = qOptions(st.i), sel = st.a[q.k] || [];
  qEl.innerHTML = head + `<div class="opts${q.multi||opts.length>4?" two":""}${q.multi?" multi":""}">${opts.map((o,j)=>`<button class="opt" data-j="${j}" aria-pressed="${sel.includes(j)}">${esc(o)}</button>`).join("")}</div>
    <div class="qnav"><button class="btn ghost" id="q-back">${esc(t.qBack)}</button>
    <button class="btn" id="q-next" ${sel.length?"":"disabled"}>${esc(isLast?t.qDone:t.qNext)}</button></div>`;
  qEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const j = +b.dataset.j;
    if(q.multi){ let cur = (st.a[q.k]||[]).slice(); cur = cur.includes(j) ? cur.filter(x=>x!==j) : cur.concat(j); st.a[q.k] = cur; saveQ(); renderQuiz(); }
    else { st.a[q.k] = [j]; st.i++; saveQ(); renderQuiz(); }
  });
  $("#q-back").onclick = () => { st.i--; saveQ(); renderQuiz(); };
  $("#q-next").onclick = () => { st.i++; saveQ(); renderQuiz(); };
}
function score(){
  const a = st.a, s = {w:0,d:0,c:0};
  QL.forEach(q => { if(q.o) (a[q.k]||[]).forEach(j => { const v = q.o[j]; for(const k in v) s[k]+=v[k]; }); });
  const g = (a.g||[0])[0] === 1 ? "m" : "w";
  let season;
  if(s.w > 0){ const sp = (s.d<0?1:0)+(s.c>0?1:0), au = (s.d>0?1:0)+(s.c<0?1:0); season = sp>au ? "spring" : au>sp ? "autumn" : (s.d>0 ? "autumn" : "spring"); }
  else { const wi = (s.d>0?1:0)+(s.c>0?1:0), su = (s.d<0?1:0)+(s.c<0?1:0); season = wi>su ? "winter" : su>wi ? "summer" : (s.d>0||s.c>0 ? "winter" : "summer"); }
  const sh = (a.shoulders||[1])[0], wa = (a.waist||[1])[0];
  let shape;
  if(wa === 3) shape = "O";
  else if(g === "w") shape = sh===0 ? "V" : sh===2 ? "A" : (wa===0 ? "X" : "H");
  else shape = sh===2 ? "A" : sh===0 ? (wa===0 ? "V" : "X") : (wa<=1 ? "X" : "H");
  const h = parseInt((a.size||{}).h, 10);
  let hc = "mid";
  if(h){ const lo = g==="m"?172:160, hi = g==="m"?185:175; hc = h<lo ? "petite" : h>=hi ? "tall" : "mid"; }
  const styles = (a.styles||[]).map(j => STYLES[j][0]);
  return {g, season, shape, hc, styles, neutral: Math.abs(s.w) <= 1};
}
function roleColor(season, role, shift=0){
  const s = SEASONS[season];
  if(role === "metal") return [s.mhex, X(s.metal), X(s.metal), X(s.metal)];
  if(role[0] === "n") return s.neutral[+role[1]];
  return s.best[(+role[1]*3 + shift) % s.best.length];
}
function fitsFor(p){ return TRENDS.filter(tr => tr.g==="b" || tr.g===p.g).map(tr => [tr, tr.fit(p)]); }
function renderResult(){
  const t = L(), r = score();
  profile = r; store.set("styleai-profile", r);
  const s = SEASONS[r.season], sh = SHAPES[r.g][r.shape];
  const styleNames = r.styles.map(k => X(STYLES.find(x=>x[0]===k)[1]));
  const capsule = CAPSULE[r.g].map(([n,role]) => { const c = roleColor(r.season, role); return `<li>${swatch(c,{sm:true})}<span>${esc(X(n))} <small class="muted">· ${esc(cn(c))}</small></span></li>`; }).join("");
  const pieces = r.styles.map(k => { const row = STYLES.find(x=>x[0]===k); return `<li><span><b>${esc(X(row[1]))}:</b> ${esc(X(r.g==="m"?row[3]:row[2]))}</span></li>`; }).join("");
  const tr = fitsFor(r).filter(([,f]) => f[0]==="yes").slice(0,3).map(([x,f]) => `<li><span><b>${esc(X(x.name))}</b> · ${esc(X(f[1]))}</span></li>`).join("");
  const hTip = r.hc!=="mid" ? `<p class="note">${esc(X(HEIGHT[r.g][r.hc]))}</p>` : "";
  const summary = t.rSummary(X(s.name), X(s.sub), X(sh.name), styleNames.join(", "));
  qEl.innerHTML = `<div class="result">
    <span class="eyebrow">${esc(t.rEyebrow)}</span>
    <h3>${esc(X(s.name))} · ${esc(X(sh.name))}</h3>
    <div class="chips"><span class="chip">${esc(X(s.sub))}</span>${styleNames.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
    <div class="rgrid">
      <div><span class="eyebrow">${esc(t.rColors)}</span><div class="sws">${s.best.map(c=>swatch(c)).join("")}</div>
        <span class="mono">${esc(t.rNeutral)}</span><div class="sws">${s.neutral.map(c=>swatch(c,{sm:true})).join("")}</div>
        <span class="mono">${esc(t.rAvoid)}</span><div class="sws">${s.avoid.map(c=>swatch(c,{sm:true,x:true})).join("")}</div>
        <p class="fine">${esc(t.rMetal)}: ${esc(X(s.metal))}. ${esc(X(s.rule))}</p></div>
      <div><span class="eyebrow">${esc(t.rShape)}</span><p>${esc(X(sh.goal))}</p>
        <ul class="bul">${X(sh.good).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <p class="fine">${esc(t.rAcc)}: ${esc(X(sh.acc))}</p></div>
      <div><span class="eyebrow">${esc(t.rCapsule)}</span><ul class="rlist">${capsule}</ul></div>
      <div>${pieces?`<span class="eyebrow">${esc(t.rStylePieces)}</span><ul class="bul">${pieces}</ul>`:""}
        ${tr?`<span class="eyebrow">${esc(t.rTrends)}</span><ul class="bul">${tr}</ul>`:""}</div>
    </div>
    ${hTip}${r.neutral?`<p class="note">${t.rNeutralNote}</p>`:""}
    <p class="fine">${esc(t.rFine)}</p>
    <div class="btns"><button class="btn" id="q-copy">${esc(t.rCopy)}</button><a class="btn ghost" href="#farbprobe">${esc(t.rToDrape)}</a><a class="btn ghost" href="#outfits">${esc(t.rToOutfits)}</a><button class="btn ghost" id="q-redo">${esc(t.rRedo)}</button></div>
    <span class="copied" id="q-copied" hidden>${esc(t.rCopied)}</span>
    <p class="mono" id="q-sum" hidden>${esc(summary)}</p></div>`;
  $("#q-redo").onclick = () => { st = {i:0,a:{}}; saveQ(); renderQuiz(); };
  $("#q-copy").onclick = () => {
    const ok = () => { $("#q-copied").hidden = false; };
    const fb = () => { const p=$("#q-sum"); p.hidden=false; const g=document.createRange(); g.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(g); };
    try{ navigator.clipboard.writeText(summary).then(ok, fb); }catch(e){ fb(); }
  };
  /* the rest of the page follows the new profile */
  if(!syncedOnce){ syncedOnce = true; ctSeason = r.season; fgG = r.g; fgShape = r.shape; dpSeason = r.season; trFilter = r.g; renderSeasons(); renderFigure(); renderDrape(); }
  renderOutfit(); renderTrends();
}
let syncedOnce = false;

/* ---------- colour drape with photo ---------- */
let dpSeason = P().season, dpA = 0, dpB = 0, photoUrl = null;
const faceSvg = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#D8CEC6"/><ellipse cx="50" cy="46" rx="22" ry="28" fill="#EADBCF"/><path d="M26 42 Q28 14 50 14 Q72 14 74 42 Q68 26 50 25 Q32 26 26 42Z" fill="#7C6A5E"/><path d="M38 72 h24 v20 h-24z" fill="#E4D2C4"/></svg>`;
function renderDrape(){
  const s = SEASONS[dpSeason], t = L();
  pills($("#dpSeasons"), SKEYS.map(k => [k, X(SEASONS[k].name)]), dpSeason, k => { dpSeason = k; dpA = 0; dpB = 0; renderDrape(); });
  $("#dpBest").innerHTML = s.best.map((c,i) => swatch(c,{btn:true,i,on:i===dpA})).join("");
  $("#dpAvoid").innerHTML = s.avoid.map((c,i) => swatch(c,{btn:true,i,on:i===dpB})).join("");
  $("#dpBest").querySelectorAll("button").forEach(b => b.onclick = () => { dpA = +b.dataset.i; renderDrape(); });
  $("#dpAvoid").querySelectorAll("button").forEach(b => b.onclick = () => { dpB = +b.dataset.i; renderDrape(); });
  $("#dA").style.setProperty("--c", s.best[dpA][0]); $("#dB").style.setProperty("--c", s.avoid[dpB][0]);
  $("#dATag").textContent = `${t.dpGood} · ${cn(s.best[dpA])}`; $("#dBTag").textContent = `${t.dpBad} · ${cn(s.avoid[dpB])}`;
  const inner = photoUrl ? `<img src="${photoUrl}" alt="">` : faceSvg;
  document.querySelectorAll(".drape .face").forEach(f => { if(f.dataset.src !== (photoUrl||"")){ f.innerHTML = inner; f.dataset.src = photoUrl||""; } });
  applyFrame();
}
function applyFrame(){
  const z = $("#dpZoom").value, pos = $("#dpPos").value;
  document.querySelectorAll(".drape .face img").forEach(i => { i.style.transform = `scale(${z})`; i.style.objectPosition = `50% ${pos}%`; });
}
$("#dpFile").onchange = e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  if(photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(f); $("#dpRanges").hidden = false; renderDrape();
};
$("#dpZoom").oninput = applyFrame; $("#dpPos").oninput = applyFrame;

/* ---------- outfits ---------- */
let ofOcc = "buero", ofW = "cold", ofShift = 0;
const pick = (item, w) => (item && (item.de !== undefined)) ? item : (item ? item[w] : null);
function figureSvg(parts, g){
  const c = n => parts[n] ? parts[n].c : null;
  const top = c("top"), bottom = c("bottom"), dress = c("dress"), suit = c("suit"), layer = c("layer"), shoes = c("shoes") || "#555", bag = c("bag"), acc = c("acc"), metal = c("metal");
  const wide = g==="m" ? 30 : 26, body = suit || top || dress || "#ccc";
  let s = `<svg viewBox="0 0 140 300"><circle cx="70" cy="24" r="14" fill="#EADBCF"/><rect x="64" y="36" width="12" height="10" fill="#E4D2C4"/>`;
  if(dress && !suit){ s += `<path d="M${70-wide} 46 h${wide*2} l${g==="m"?0:12} 128 h-${wide*2+(g==="m"?0:24)} z" fill="${dress}"/>`; s += `<rect x="56" y="174" width="10" height="84" fill="#E4D2C4"/><rect x="74" y="174" width="10" height="84" fill="#E4D2C4"/>`; }
  else {
    const leg = suit || bottom || "#555";
    s += `<rect x="${70-wide+4}" y="118" width="${wide-5}" height="140" rx="3" fill="${leg}"/><rect x="71" y="118" width="${wide-5}" height="140" rx="3" fill="${leg}"/>`;
    s += `<rect x="${70-wide}" y="46" width="${wide*2}" height="78" rx="8" fill="${body}"/>`;
    if(suit && top) s += `<path d="M62 46 L70 74 L78 46 Z" fill="${top}"/>`;
    if(acc && suit) s += `<path d="M68 52 h4 l2 26 l-4 5 l-4 -5 z" fill="${acc}"/>`;
  }
  if(layer) s += `<path d="M${70-wide-4} 44 h${wide-2} v${g==="m"?120:132} h-${wide-2} z" fill="${layer}" opacity=".95"/><path d="M${72} 44 h${wide+2} v${g==="m"?120:132} h-${wide-2} z" fill="${layer}" opacity=".95"/>`;
  if(acc && !suit) s += g==="m" ? `<rect x="${70+wide-12}" y="56" width="8" height="8" rx="1" fill="${acc}"/>` : "";
  s += `<rect x="52" y="258" width="16" height="10" rx="4" fill="${shoes}"/><rect x="72" y="258" width="16" height="10" rx="4" fill="${shoes}"/>`;
  if(bag) s += `<rect x="${70+wide+6}" y="128" width="22" height="18" rx="3" fill="${bag}" stroke="rgba(0,0,0,.15)"/><path d="M${70+wide+10} 128 q7 -10 14 0" fill="none" stroke="${bag}" stroke-width="2"/>`;
  if(metal) s += `<circle cx="${70-wide-6}" cy="${g==="m"?120:30}" r="3.5" fill="${metal}" stroke="rgba(0,0,0,.2)"/>`;
  return s + `</svg>`;
}
function renderOutfit(){
  const t = L(), p = P(), s = SEASONS[p.season], o = OUT[p.g][ofOcc];
  pills($("#ofOcc"), OCC.map(([k,n]) => [k, X(n)]), ofOcc, k => { ofOcc = k; renderOutfit(); });
  pills($("#ofWeather"), WEATHER.map(([k,n]) => [k, X(n)]), ofW, k => { ofW = k; renderOutfit(); });
  $("#ofProfile").textContent = (p.demo ? t.ofDemo : t.ofMine)(gName(p.g), X(s.name), X(SHAPES[p.g][p.shape].name));
  const parts = {}; let rows = "", nearFace = null;
  o.items.forEach(([slot, item, role]) => {
    const it = pick(item, ofW); if(!it) return;
    const col = roleColor(p.season, role, ofShift);
    parts[slot] = {c: col[0]};
    if(!nearFace && role[0]==="a" && ["top","dress","acc"].includes(slot)) nearFace = col;
    const colTxt = role==="metal" ? "" : `<small>${esc(cn(col))}</small>`;
    rows += `<li><span class="slot">${esc(X(SLOTS[slot]))}</span><span class="it"><span class="dot" style="--c:${col[0]}"></span><span>${esc(X(it))}</span>${colTxt}</span></li>`;
  });
  $("#ofList").innerHTML = rows;
  $("#ofFig").innerHTML = figureSvg(parts, p.g);
  const why = [];
  if(nearFace) why.push(t.whyColor(cn(nearFace)));
  why.push(t.whyBase(cn(s.neutral[3]), cn(s.neutral[1])));
  why.push(t.whyMetal(X(s.metal)));
  const sh = SHAPES[p.g][p.shape]; why.push(`${X(sh.name)}: ${X(sh.goal)}`);
  if(p.hc && p.hc!=="mid") why.push(X(HEIGHT[p.g][p.hc]));
  why.push(X(o.rule));
  $("#ofWhy").innerHTML = why.map(x=>`<li>${esc(x)}</li>`).join("");
}
$("#ofShuffle").onclick = () => { ofShift = (ofShift+1) % 8; renderOutfit(); };

/* ---------- trends ---------- */
let trFilter = P().g;
function renderTrends(){
  const t = L(), p = P();
  pills($("#trFilter"), [["all",t.trAll],["w",t.gw],["m",t.gm]], trFilter, k => { trFilter = k; renderTrends(); });
  const sName = X(SEASONS[p.season].name), shName = X(SHAPES[p.g][p.shape].name);
  $("#trProfile").textContent = (p.demo ? t.trDemo : t.trMine)(sName, shName);
  const list = TRENDS.filter(tr => trFilter==="all" || tr.g==="b" || tr.g===trFilter);
  $("#trList").innerHTML = list.map(tr => {
    const f = tr.fit({...p, g: trFilter==="all" ? p.g : trFilter});
    const who = tr.g==="w" ? t.gw : tr.g==="m" ? t.gm : `${t.gw} · ${t.gm}`;
    return `<article class="card trend"><span class="mono">${esc(who)}</span><h3>${esc(X(tr.name))}</h3><p class="muted">${esc(X(tr.desc))}</p>
      <span class="badge ${f[0]}">${esc(f[0]==="yes"?t.trYes:t.trAdapt)}</span><p class="tip">${esc(X(f[1]))}</p></article>`;
  }).join("");
}

applyLang();
if(st.i >= QL.length) syncedOnce = true;
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
